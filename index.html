<body>
<title>Střižna</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: sticky toolbar like an NLE, projects as tinted "clips", detail = main column + side rail */
:root{
  --bg:#131418; --surface:#1a1c21; --surface-2:#22252c; --line:#2d3139; --line-2:#3a3f48;
  --fg:#eeede9; --muted:#9ca2ad; --faint:#6c727d;
  --accent:#f0c987; --accent-ink:#1f1808;
  --ok:#7cc29a; --warn:#e8a33d; --bad:#e3685b; --info:#8fb6e8;
  --body:'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --display:var(--body);
  --mono:var(--body);
  --colline:rgba(255,255,255,.055);
  --we:rgba(255,255,255,.075);
  --vac:rgba(124,194,154,.55);
  --unpaid:#1f5a63;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
h1{font-weight:700;letter-spacing:-.02em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.faint{color:var(--faint)} .muted{color:var(--muted)}
.spacer{flex:1}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(19,20,24,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--fg)}
.brand b{font-weight:800;font-size:20px;line-height:1;letter-spacing:-.02em}
.brand small{font-size:10px;font-weight:600;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
.nav{display:flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.nav button{border:0;background:none;color:var(--muted);padding:6px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.nav button span{font-family:var(--mono);font-size:11px;color:var(--faint)}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-2)}
.search{flex:1;min-width:220px;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 12px 9px 34px;font-size:14px}
.search input::placeholder{color:var(--faint)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--line-2);border-radius:4px;padding:1px 5px}
.top-actions{display:flex;gap:8px}
@media (max-width:820px){.search{order:5;flex-basis:100%}.search kbd{display:none}}

.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 80px;display:grid;gap:18px}

/* buttons */
.btn{font-weight:600;font-size:13px;line-height:1;padding:9px 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:#f6d6a0}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);background:transparent;border-color:rgba(227,104,91,.4)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#200b08}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#200b08}
.btn.sm{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkback{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-weight:600;font-size:13px;justify-self:start}
.linkback:hover{color:var(--fg)}

/* headings */
.view-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.view-head h1{font-size:clamp(24px,2.6vw,30px);line-height:1.15}
.view-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sel{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.sel select,.inp{background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:14px;width:100%;min-width:0}
.sel select{width:auto;background:var(--surface)}
.inp.invalid{border-color:var(--bad);box-shadow:0 0 0 2px rgba(227,104,91,.2)}
.inp:focus,.sel select:focus,.search input:focus{border-color:var(--accent);outline:none}
textarea.inp{resize:vertical;line-height:1.45}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.strip>div{padding:12px 16px;border-right:1px solid var(--line);min-width:0}
.strip>div:last-child{border-right:0}
.strip dt{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.strip dd{margin:4px 0 0;font-size:18px;font-weight:600}
.strip dd small{font-size:12px;color:var(--muted)}
.scope-row{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;margin-bottom:-8px}
.strip dd small{display:block;font-weight:500;margin-top:1px;color:var(--muted);font-size:12px}
.scope-row .hint b{color:var(--muted)}
.infoline{display:flex;flex-wrap:wrap;gap:8px 34px;font-size:13px;color:var(--muted)}
.infoline>span{display:inline-flex;gap:10px;align-items:baseline}
.infoline b{color:var(--fg);font-weight:600}
.pm{display:grid;gap:5px}
.pm .meter-bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.pm .meter-bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--info)}
.pm.bad .meter-bar i{background:var(--bad)}
.pm.budget .meter-bar i{background:var(--ok)} .pm.budget .meter-bar i.owed{opacity:.38} .pm.budget.warn .meter-bar i{background:var(--warn)} .pm.budget.bad .meter-bar i{background:var(--bad)}
.pm-row{display:flex;justify-content:space-between;gap:4px 12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.pm-row b{color:var(--fg);font-weight:600}
.pm-r{display:inline-flex;gap:12px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.pm-row b.t-bad,.t-bad{color:var(--bad)} .pm-row b.t-warn,.t-warn{color:var(--warn)}
.miss{color:var(--warn);font-size:11px;font-weight:700}
.wip{color:var(--info);font-style:italic;opacity:.85}
.dlist-h{display:flex;justify-content:space-between;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.dlist{list-style:none;margin:0;padding:0;display:grid;max-height:240px;overflow:auto}
.dlist li{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.dlist li:first-child{border-top:0}
.dl-day{flex:1;display:grid;grid-template-columns:auto 22px minmax(0,1fr) auto;gap:10px;align-items:center;background:none;border:0;padding:8px 2px;cursor:pointer;text-align:left;color:var(--fg)}
.dl-day:hover b{color:var(--accent)}
.dl-note{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mnav{display:flex;align-items:center;gap:6px;font-size:13px}
.mnav .gear{font-size:18px;line-height:1;padding:2px 8px}
.days{border-collapse:separate;border-spacing:2px;font-size:11px}
.days th{font-weight:600;color:var(--faint);text-align:center;min-width:26px}
.days th.we,.days td.we .dcell:not(.on){opacity:.55}
.days .who-h{text-align:left;color:var(--muted);padding-right:8px;white-space:nowrap}
.days .sum-h{padding-left:8px;text-align:right;white-space:nowrap}
.dcell{width:100%;min-width:26px;height:26px;border-radius:5px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:10.5px;font-weight:700;cursor:pointer;padding:0}
.dcell.on{background:color-mix(in srgb,var(--c) 35%,var(--surface-2));border-color:color-mix(in srgb,var(--c) 60%,transparent)}
.dcell:hover{border-color:var(--accent)}
.td-today .dcell{box-shadow:0 0 0 1px var(--fg)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-w{font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;text-align:center}
.cal-d{min-height:58px;border-radius:7px;background:var(--surface-2);padding:5px 7px;display:grid;align-content:start;gap:2px;border:1px solid transparent}
.cal-d.we{opacity:.7}
.cal-d.on{border-color:var(--line-2)}
.cal-d.td-today{border-color:var(--fg)}
.cal-n{font-size:11px;color:var(--faint)}
.cal-d b{font-size:13px}
.cal-dots{display:flex;gap:3px;flex-wrap:wrap}
.cal-dots .dot{width:7px;height:7px}
.sync{font-size:12px;color:var(--muted);align-self:center;white-space:nowrap}
.sync.ok{color:var(--ok)} .sync.bad{color:var(--bad)}
.auth{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.auth-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:24px;display:grid;gap:16px}
.auth-brand{display:flex;align-items:baseline;gap:10px}
.auth-brand b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.auth-brand small{font-size:10px;font-weight:600;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
.auth-msg{font-size:13px;color:var(--info)} .auth-msg.bad{color:var(--bad)}
.auth-links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.auth-links button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:12.5px}
.auth .btn.primary{justify-content:center}
.wk-we{fill:var(--we)}
.wk-hit{fill:transparent;cursor:pointer}
.wk-hit:hover{fill:rgba(255,255,255,.04)}
.wk-we-dot{background:var(--we);border:1px solid var(--line-2)}
.wk-bar{fill:var(--accent);pointer-events:none}
.wk-bar.work{fill:var(--accent)} .wk-bar.wip{fill:var(--accent);opacity:.45}
.wk-bar.wkend{fill:#9aa0a8;opacity:.28}
.wk-bar.vac{fill:var(--vac)} .wk-bar.unpaid{fill:var(--unpaid)}
.wk-bar.prev{fill:var(--muted);opacity:.45}
.chart .gl.key{stroke:var(--line-2)} .chart .ax.key{fill:var(--fg);font-weight:600}
.chart .gl.mid{stroke:var(--info);stroke-dasharray:6 4;opacity:.8} .chart .ax.mid{fill:var(--info)}
.chart .avgl.in{stroke:#8fd1c4} .chart .avgl.out{stroke:#f19a90}
.chart .faintt{fill:var(--faint)}
.avg-lg{display:inline-flex;align-items:center;gap:6px}
.avg-lg::before{content:"";width:16px;border-top:2px dashed currentColor}
.avg-lg.in{color:#8fd1c4} .avg-lg.out{color:#f19a90}
.avg-lg.yr{color:var(--accent)} .avg-lg.yrp{color:var(--muted)}
.chart .avgl.yr{stroke:var(--accent);opacity:.9} .chart .avgl.yrp{stroke:var(--muted);opacity:.8}
.invis{visibility:hidden}
.wk-bar[data-act]{pointer-events:auto;cursor:pointer}
.chart .tv.sm{font-size:9.5px}
.chart .yl{fill:none;stroke-width:1.8;stroke-linejoin:round}
.chart .yl.in{stroke:#8fd1c4} .chart .yl.out{stroke:#f19a90} .chart .yl.ex{stroke:#c9b6f2;stroke-dasharray:2 3}
.chart .yl.prev{opacity:.4;stroke-dasharray:5 4;stroke-width:1.3}
.chart .ydot{stroke:none} .chart .ydot.in{fill:#8fd1c4} .chart .ydot.out{fill:#f19a90} .chart .ydot.ex{fill:#c9b6f2}
.chart .yl.vac{stroke:#7cc29a} .chart .ydot.vac{fill:#7cc29a} .chart .tv.vacd{fill:#7cc29a}
.chart .tv.in,.chart .tv.out,.chart .tv.ex,.chart .tv.vacd,.chart .tv.exp{paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round} .chart .tv.exp{fill:#c9b6f2;opacity:.55}
.chart .tv.in{fill:#8fd1c4} .chart .tv.out{fill:#f19a90} .chart .tv.ex{fill:#c9b6f2}
.chart .vacb rect{fill:#7cc29a}
.chart .tv.in-bar{fill:#3a2c0c;font-weight:600} .chart .tv.in-bar.prev{fill:var(--bg)} .chart .vacb text{fill:#0d1a14;font-family:var(--mono);font-size:9.5px;font-weight:600}
.ln-lg{display:inline-flex;align-items:center;gap:6px}
.ln-lg::before{content:"";width:16px;border-top:2px solid currentColor}
.ln-lg.vac{color:#7cc29a} .ln-lg.in{color:#8fd1c4} .ln-lg.out{color:#f19a90} .ln-lg.ex{color:#c9b6f2} .ln-lg.ex::before{border-top-style:dotted}
.chart .ax.we{fill:var(--muted)}
.mnav.big{font-size:16px;gap:10px}
.mnav.big b{min-width:150px;text-align:center}
.wk-d{cursor:pointer;text-align:left;font:inherit;color:inherit}
.wk-d:hover{border-color:var(--accent)}
.wk-d small{font-size:10.5px;color:var(--muted);line-height:1.2}
.wk-d.vac{background:rgba(124,194,154,.18);border-color:rgba(124,194,154,.45)}
.wk-d.vac b{color:var(--ok)}
.wk-d.unpaid b{color:var(--warn)}

.chart .tv.vac{fill:var(--ok)}
.wk-type{flex-wrap:wrap}
.wk-type label{position:relative;cursor:pointer}
.wk-type input{position:absolute;opacity:0;width:1px;height:1px}
.wk-type span{display:block;padding:8px 12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.wk-type input:checked+span{background:var(--surface-2);color:var(--fg)}
.wk-type input:focus-visible+span{outline:2px solid var(--accent)}
.facts.one{grid-template-columns:1fr}
.linkish{background:none;border:0;padding:0;color:var(--fg);font:inherit;font-weight:600;cursor:pointer}
.linkish:hover{text-decoration:underline}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.lc{font-weight:600}
.lc.ok,.lc.ok b{color:var(--ok)} .lc.mid,.lc.mid b{color:var(--accent)} .lc.bad,.lc.bad b{color:var(--bad)}
.lc small{color:var(--muted)}
.hc{display:inline-grid;place-items:center;min-width:34px;padding:3px 6px;border-radius:6px;font-weight:700;font-size:12px}
.hc.fc{border:1px dashed color-mix(in srgb,currentColor 45%,transparent);background-color:transparent}
.hc.fc.ok{background-image:repeating-linear-gradient(135deg,rgba(124,194,154,.13) 0 3px,rgba(124,194,154,.04) 3px 7px)}
.hc.fc.mid{background-image:repeating-linear-gradient(135deg,rgba(240,201,135,.14) 0 3px,rgba(240,201,135,.04) 3px 7px)}
.hc.fc.bad{background-image:repeating-linear-gradient(135deg,rgba(227,104,91,.2) 0 3px,rgba(227,104,91,.06) 3px 7px)}
.hc.fc.zero{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 3px,transparent 3px 7px);border-color:var(--line-2)}
.hc.zero{background:var(--surface-2);color:var(--faint)}
.hc.ok{background:rgba(124,194,154,.14);color:var(--ok)}
.hc.mid{background:rgba(240,201,135,.16);color:var(--accent)}
.hc.bad{background:rgba(227,104,91,.22);color:#f19a90}
.load{display:grid;gap:6px;margin-top:10px}
.load-now{display:flex;justify-content:space-between;gap:8px;font-size:12px;flex-wrap:wrap}
.heat{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.heat .hc{min-width:0;padding:2px 0 3px;font-size:11.5px;line-height:1.1}
.heat .hc em{display:block;font-style:normal;font-size:9px;font-weight:600;opacity:.75}
.dot.hatch{background:repeating-linear-gradient(45deg,var(--muted) 0 2px,transparent 2px 4px);border:1px dashed var(--muted);border-radius:2px}
.chart .mk.dl{stroke:var(--bad);stroke-width:1.5}
.chart .mk.fin{stroke:var(--warn);stroke-dasharray:5 3;stroke-width:1.5}
.chart .mkt{font-size:11px;font-family:var(--body);font-weight:600}
.chart .mkt.dl{fill:var(--bad)} .chart .mkt.fin{fill:var(--warn)}
.chart .today{stroke:var(--faint);stroke-dasharray:2 3}
.chart .capl{stroke:var(--bad);stroke-dasharray:6 4;opacity:.75}
.chart .capt{fill:var(--bad);font-size:11px;font-family:var(--body)}
.chart .ax.fut,.chart .tv.fut{fill:var(--muted);font-style:italic}
.meter.big .meter-bar{height:10px}
.meter.big .meter-lbl{font-size:13px}
.meter.prog .meter-bar i{background:var(--info)}
.meter.prog.bad .meter-bar i{background:var(--bad)}
.meter.big .meter-bar i{background:var(--info)}
.meter.big.bad .meter-bar i{background:var(--bad)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0}
.facts>div{background:var(--surface-2);border-radius:9px;padding:9px 12px;display:grid;gap:2px}
.facts dt{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.facts dd{margin:0;font-size:16px;font-weight:600}
.facts span{font-size:11.5px;color:var(--muted)}
.facts .bad dd{color:var(--bad)} .facts .warn dd{color:var(--warn)} .facts .ok dd{color:var(--ok)}
.alert{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:9px;font-size:13px;border:1px solid}
.alert p{flex:1 1 260px}
.alert.warn{border-color:rgba(232,163,61,.4);background:rgba(232,163,61,.07);color:#f0c27a}
.alert.bad{border-color:rgba(227,104,91,.45);background:rgba(227,104,91,.08);color:#f19a90}
.alert.ok{border-color:rgba(124,194,154,.35);background:rgba(124,194,154,.06);color:var(--ok)}
.sub-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.sub-h span{text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint);margin-left:6px}
.pk-load{font-size:11px;text-align:right;line-height:1.3}
.remind{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);padding:10px 14px;border:1px dashed var(--line-2);border-radius:10px}
.remind b{color:var(--fg)}
.remind button{background:var(--surface-2);border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.remind button:hover{border-color:var(--accent)}

/* chips, dots, avatars, meters */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;line-height:1;padding:4px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.chip.warn{color:var(--warn);border-color:rgba(232,163,61,.45);background:rgba(232,163,61,.08)}
.chip.bad{color:var(--bad);border-color:rgba(227,104,91,.5);background:rgba(227,104,91,.1)}
.chip.ok{color:var(--ok);border-color:rgba(124,194,154,.4);background:rgba(124,194,154,.07)}
.chip.info{color:var(--info);border-color:rgba(143,182,232,.4);background:rgba(143,182,232,.07)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.av{--c:#888;width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.02em;background:color-mix(in srgb,var(--c) 30%,var(--surface-2));color:color-mix(in srgb,var(--c) 45%,#fff);border:2px solid var(--surface);flex:none}
.av.lg{width:42px;height:42px;font-size:14px}
.av.xl{width:68px;height:68px;font-size:22px;border-width:0}
.avatars{display:flex;padding-left:6px}
.avatars .av{margin-left:-6px}
.meter{display:grid;gap:5px}
.meter-bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.meter-bar i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:99px}
.meter.warn .meter-bar i{background:var(--warn)}
.meter.bad .meter-bar i{background:var(--bad)}
.meter-lbl{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);font-family:var(--mono);flex-wrap:wrap}
.meter.warn .meter-lbl b{color:var(--warn)} .meter.bad .meter-lbl b{color:var(--bad)} .meter .meter-lbl b{font-weight:500;color:var(--fg)}
.stars{color:var(--accent);letter-spacing:1px;white-space:nowrap}
.stars i{color:var(--line-2);font-style:normal}

/* project cards (clips) */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pcard{--c:#888;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
@media (prefers-reduced-motion:no-preference){.pcard:hover{transform:translateY(-2px)}}
.clip{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px 10px;background:color-mix(in srgb,var(--c) 26%,var(--surface-2));border-bottom:1px solid color-mix(in srgb,var(--c) 45%,transparent);min-width:0}
.clip-name{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.25;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbody{padding:13px 14px 15px;display:grid;gap:12px;flex:1}
.pco{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.pco b{color:var(--fg);font-weight:600}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.pstats dt{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:700}
.pstats dd{margin:2px 0 0;font-size:13.5px;font-weight:600;white-space:nowrap}
.pstats dd.warn{color:var(--warn)}
.nobudget{font-size:11px;font-family:var(--mono);color:var(--faint)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:12px}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}

/* section cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px 18px;display:grid;gap:14px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card-h .hint{font-size:12px;color:var(--faint)}

/* project head */
.ph{display:flex;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;align-items:flex-end}
.ph-title{display:flex;gap:14px;align-items:flex-start;min-width:0}
.ph-title .swatch{width:10px;height:40px;border-radius:4px;background:var(--c);flex:none;margin-top:6px}
.ph h1{font-size:clamp(26px,3vw,34px);line-height:1.1}
.ph-meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:10px;font-size:13px;color:var(--muted)}
.ph-meta b{color:var(--fg);font-weight:600}
.ph-meta button.chip{cursor:pointer;background:none}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 11px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--fg)}
.closed-banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:rgba(143,182,232,.08);border:1px solid rgba(143,182,232,.3);color:var(--info);font-size:13px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi dd{font-size:18px}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:4px;align-content:start;min-width:0}
.kpi dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kpi dd{margin:0;font-size:21px;font-weight:600;line-height:1.2}
.kpi dd small{font-size:12px;color:var(--muted)}
.kpi .meter{margin-top:4px}
.kpi.warn dd{color:var(--warn)}

.detail{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.detail>div{display:grid;gap:16px;min-width:0}
@media (max-width:1180px){.detail{grid-template-columns:minmax(0,1fr)}}

/* chart */
.chart-scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.chart{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .gl.base{stroke:var(--line-2)}
.chart .ax{fill:var(--faint);font-family:var(--mono);font-size:11px}
.chart .tv{fill:var(--muted);font-family:var(--mono);font-size:11px}
.chart .avgl{stroke:var(--accent);stroke-dasharray:4 4;stroke-width:1;opacity:.7}
.chart .avgt{fill:var(--accent);font-family:var(--mono);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* tables */
.tscroll{overflow-x:auto;margin:0 -18px;padding:0 18px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 10px 8px;white-space:nowrap}
.tbl td,.tbl tbody th{padding:9px 10px;border-top:1px solid var(--line);vertical-align:middle}
.tbl tbody th{font-size:13px;letter-spacing:0;text-transform:none;color:var(--fg);font-weight:600;white-space:nowrap}
.tbl .num{text-align:right;white-space:nowrap}
.tbl th.num{text-align:right}
.tbl tfoot td{border-top:1px solid var(--line-2);font-weight:600;padding-top:10px}
.tbl tr.empty-row td,.tbl tr.empty-row th{color:var(--faint)}
.tbl tr.is-removed td{opacity:.55}
.tbl td:first-child,.tbl th:first-child{padding-left:0}
.tbl td:last-child,.tbl th:last-child{padding-right:0}
.tbl .act{text-align:right;width:1%}
.tbl td+td,.tbl th+th,.tbl tbody th+td{border-left:1px solid var(--colline)}
.tbl thead th+th{border-left:1px solid var(--colline)}
.thbtn{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;white-space:nowrap}
.thbtn:hover{color:var(--fg)}
.thbtn span{font-size:9px;color:var(--accent);min-width:8px}
.thbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
th[aria-sort="ascending"],th[aria-sort="descending"]{color:var(--fg)}
.num .thbtn{flex-direction:row-reverse}
.thsel{background:transparent;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;padding:0;max-width:150px}
.thsel option{text-transform:none;background:var(--surface);color:var(--fg)}
.tbl.compact td,.tbl.compact tbody th{padding:8px 8px}
.tbl.compact th{padding:0 8px 8px}
.tbl.compact td:first-child,.tbl.compact th:first-child{padding-left:0}
.tbl.compact td:last-child,.tbl.compact th:last-child{padding-right:0}
.c-who .who{min-width:0}
.c-who{min-width:150px}
.sh{display:inline-grid;gap:4px;width:58px;text-align:right}
.sh i{display:block;height:3px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.sh i i{height:100%;border-radius:3px}
.capc{display:grid;gap:4px;width:64px}
.capc .meter-bar{height:4px}
.capc span{font-size:11px;color:var(--muted);text-align:right}
.capc.warn span{color:var(--warn)} .capc.bad span{color:var(--bad)}
.capc.warn .meter-bar i{background:var(--warn)} .capc.bad .meter-bar i{background:var(--bad)}
.bal{display:inline-grid;text-align:right;line-height:1.25}
.bal small{font-size:10.5px;color:var(--faint);font-weight:600}
.bal.warn b{color:var(--warn)} .bal.info b{color:var(--info)} .bal.ok b{color:var(--ok);font-weight:600}
.bal b{font-weight:600}
.gear{background:none;border:1px solid transparent;border-radius:7px;color:var(--muted);cursor:pointer;padding:5px;display:inline-grid;place-items:center}
.gear:hover{color:var(--fg);border-color:var(--line-2);background:var(--surface-2)}
@media (max-width:700px){
  .tbl.stack thead tr{display:flex;flex-wrap:wrap;gap:6px 12px;padding-bottom:8px}
  .tbl.stack thead th{padding:0;border:0}
  .tbl.stack thead th:empty{display:none}
  .tbl.stack tbody tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px;padding:12px 0;border-top:1px solid var(--line)}
  .tbl.stack tbody td{border:0;padding:0;text-align:left}
  .tbl.stack tbody td::before{content:attr(data-l);display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
  .tbl.stack tbody td.c-who{grid-column:1 / -2}
  .tbl.stack tbody td.c-who::before,.tbl.stack tbody td.act::before{display:none}
  .tbl.stack tbody td.act{grid-column:-2 / -1;text-align:right}
  .tbl.stack .sh,.tbl.stack .bal{text-align:left}
  .tbl.stack tfoot{display:none}
}
.who{display:flex;gap:10px;align-items:center;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:170px}
.who b{display:block;font-weight:600}
.who small{display:block;color:var(--muted);font-size:11.5px}
.who:hover b{text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}

/* share block */
.share-bar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface-2)}
.share-bar i{display:block;min-width:2px}
.share-list{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.share-list li{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;font-size:13px}
.share-list li span:last-child{color:var(--muted);font-family:var(--mono);font-size:12px;min-width:56px;text-align:right}

/* payments */
.pays{list-style:none;margin:0;padding:0;display:grid;max-height:340px;overflow:auto}
.pay{width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:9px 0;cursor:pointer;text-align:left}
.pays li:first-child .pay{border-top:0}
.pay:hover b{color:var(--accent)}
.pay span{display:flex;gap:8px;align-items:center;min-width:0}
.pay small{display:block;color:var(--muted);font-size:11.5px}
.pay b{font-family:var(--mono);font-weight:500;white-space:nowrap}

/* notes */
.notes{display:grid;gap:12px}
.note-add{display:grid;gap:8px;justify-items:end}
.note-list{list-style:none;margin:0;padding:0;display:grid}
.note-list li{padding:10px 0;border-top:1px solid var(--line);display:grid;gap:4px}
.note-meta{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--faint)}
.note-list p{font-size:13.5px;overflow-wrap:anywhere}
.x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:11px;padding:0 2px;border-radius:4px}
.x:hover{color:var(--bad)}
.x.armed{color:#200b08;background:var(--bad);padding:1px 6px}

/* directory */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.dcard{--c:#888;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;transition:border-color .15s}
.dcard:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.dcard h3{font-size:15px;font-weight:700}
.dcard .pos{font-size:12.5px;color:var(--muted)}
.dcard .contact{font-size:11.5px;color:var(--faint);margin-top:6px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.rate{font-size:12px;text-align:right;white-space:nowrap}
.rate small{display:block;color:var(--faint);font-family:var(--mono);font-size:10.5px}

/* person head */
.perhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.perhead h1{font-size:clamp(26px,3vw,34px);line-height:1.1}
.perhead .pos{color:var(--muted);margin-top:6px}
.contact-list{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px}
.contact-list span{display:inline-flex;gap:6px;align-items:center}
.copy{background:none;border:1px solid var(--line-2);border-radius:5px;color:var(--muted);font-size:10px;padding:2px 6px;cursor:pointer}
.copy:hover{color:var(--fg)}
.tagrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tagbtn{width:20px;height:20px;border-radius:50%;background:var(--c);border:0;cursor:pointer;padding:0}
.tagbtn[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.alist{display:grid;gap:8px}
.arow{--c:#888;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid transparent;cursor:pointer;text-align:left;width:100%}
.arow:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.arow b{font-weight:600}
.arow small{display:block;color:var(--muted);font-size:12px}
.arow .r{text-align:right;font-family:var(--mono);font-size:12px}

/* archive */
.acard{--c:#888;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.acard:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.acard .clip{background:color-mix(in srgb,var(--c) 14%,var(--surface-2))}

/* summary */
.sum-hero{display:grid;gap:8px;padding:22px 24px;border-radius:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 18%,var(--surface)) 0%,var(--surface) 100%);border:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.sum-hero h1{font-size:clamp(28px,3.4vw,38px);line-height:1.1}
.sum-hero .sub{color:var(--muted)}
.sum-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* modal */
#modal-root{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(6,7,9,.72);overflow-y:auto;display:flex;justify-content:center;align-items:flex-start;padding:max(4vh,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(560px,100%);background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.modal.wide{width:min(820px,100%)}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-head h2{font-size:18px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.icon-btn{background:none;border:0;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:6px}
.icon-btn:hover{color:var(--fg);background:var(--surface-2)}
.m-body{padding:18px 20px 20px}
.m-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;padding-top:16px;border-top:1px solid var(--line)}
.form{display:grid;gap:14px}
.frow{display:flex;gap:12px;flex-wrap:wrap}
.frow>*{min-width:0}
.fld{display:grid;gap:6px;align-content:start}
.fld>span{font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.fld>span i{font-style:normal;color:var(--faint);font-weight:500}
.fld.grow{flex:1 1 200px}
.fld.w-date{flex:0 1 170px} .fld.w-sm{flex:0 1 130px}
.hint{font-size:12px;color:var(--faint)}
.err{font-size:12px;color:var(--bad)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{position:relative;cursor:pointer;display:grid;justify-items:center;gap:4px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw span{width:28px;height:28px;border-radius:50%;background:var(--c);display:block}
.sw em{font-style:normal;font-size:10px;color:var(--faint)}
.sw input:checked+span{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--fg)}
.sw input:checked~em{color:var(--fg)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:4px}
.picker{border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
.picker-top{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.pk-new{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:10px;background:rgba(240,201,135,.04)}
.pk-list{max-height:260px;overflow-y:auto}
.pk-row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;cursor:pointer;border-top:1px solid var(--line)}
.pk-row:first-child{border-top:0}
.pk-row:hover{background:var(--surface-2)}
.pk-row b{font-weight:600;display:block}
.pk-row small{color:var(--muted);font-size:11.5px}
.pk-row input{accent-color:var(--accent);width:16px;height:16px}
.logrows{display:grid;gap:2px}
.logrow{display:grid;grid-template-columns:auto minmax(0,1fr) 120px 56px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.logrow:first-child{border-top:0}
.logrow.is-removed{opacity:.6}
.lr-name b{display:block;font-weight:600}
.lr-name small{color:var(--muted);font-size:11.5px;display:block}
.lr-name small.lr-daily{color:var(--info)}
.lr-name small.lr-daily.diff{color:var(--warn)}
.sync-d{margin-left:6px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--fg);border-radius:6px;padding:2px 8px;font-size:11px;font-weight:600;cursor:pointer}
.sync-d:hover{border-color:var(--accent)}
.lr-name small.lr-daily:empty{display:none}
.lr-in{display:flex;align-items:center;gap:6px}
.lr-in input{text-align:right;font-family:var(--mono)}
.lr-in em{font-style:normal;color:var(--faint);font-size:12px}
.lr-d{color:var(--muted);font-size:12px;text-align:right}
.logtotal{display:flex;justify-content:space-between;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.steps{display:flex;gap:6px;align-items:center;font-size:11px;font-family:var(--mono);color:var(--faint)}
.steps span{display:inline-flex;align-items:center;gap:6px}
.steps span::before{content:attr(data-n);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--line-2)}
.steps span.on{color:var(--fg)}
.steps span.on::before{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps i{width:18px;height:1px;background:var(--line-2)}
.rate-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.stars-in{display:inline-flex;flex-direction:row-reverse;gap:2px}
.stars-in label{cursor:pointer;font-size:24px;line-height:1;color:var(--line-2);position:relative}
.stars-in input{position:absolute;opacity:0;width:1px;height:1px}
.stars-in label:hover,.stars-in label:hover~label,.stars-in label:has(input:checked),.stars-in label:has(input:checked)~label{color:var(--accent)}
.stars-in label:has(input:focus-visible){outline:2px solid var(--accent);border-radius:4px}
.dsec{display:grid;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.dsec:last-child{border-bottom:0;padding-bottom:0}
.dsec h3{font-size:14px}
.row-end{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.foot-note{font-size:12px;color:var(--faint);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.foot-note button{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:12px}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:8px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;font-size:13px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}

@media (max-width:560px){
  .m-body{padding:16px}
  .logrow{grid-template-columns:auto minmax(0,1fr) 96px}
  .lr-d{display:none}
  .pstats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .strip>div{border-right:0;border-bottom:1px solid var(--line)}
}

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */

const ymOf=iso=>ym(+iso.slice(0,4),+iso.slice(5,7));

const ymNow=()=>ymOf(todayISO());
function fmtDate(iso){if(!iso)return '—';const [y,m,d]=iso.split('-');return `${+d}. ${+m}. ${y}`;}
function daysBetween(a,b){const x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/864e5);}
const fmtNum=n=>(Math.round(n*10)/10).toLocaleString('cs-CZ',{maximumFractionDigits:1});

function parseNum(s){const v=parseFloat(String(s??'').replace(/\s/g,'').replace(',','.'));return isFinite(v)?v:0;}
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw)));const n=raw/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const TAGS=[
  {id:'okr',name:'Okr',color:'#D9A441'},

];

/* ---------- state ---------- */
/* Edice aplikace: build.py sem vloží konfiguraci (template / personal). */
const APP={"edition":"cloud","key":"strizna.cloud","data":{"settings":{"hoursPerDay":8,"capacity":20},"people":[],"projects":[],"demo":false},"cloud":{"url":"https://jjjbskjgrepbqorapfxn.supabase.co","key":"sb_publishable_Ae-I7GvkqHFgplz8sceZ7Q_kOUajYy_"},"patches":[{"id":"2026-10-28-zerofill","type":"zerofill","until":"2026-09","label":"nuly do prázdných měsíců"}],"tagline":"osobní"};
const KEY=APP.key, UIKEY=APP.key+'.ui';
let state;
let ui={view:'projects',id:null,q:'',sort:'created-desc',dsort:'name',unit:'h',msort:{k:'hours',dir:-1},hsort:{k:'from',dir:-1},scope:'active'};

try{const u=JSON.parse(localStorage.getItem(UIKEY)||'{}');['sort','dsort','unit','msort','hsort','scope'].forEach(k=>{if(u[k])ui[k]=u[k];});}catch(e){}

function valid(d){return d&&Array.isArray(d.people)&&Array.isArray(d.projects);}

function load(){try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(valid(d)){state=d;applyPatches();rollupDaily();return;}}}catch(e){}state=initialData();applyPatches();rollupDaily();}
/* Balíčky dat (jen osobní edice): přimíchají se jednou k uloženým datům. Nic nepřepisují,
   jen doplní lidi (shoda podle e-mailu nebo jména) a projekty (shoda podle názvu a data založení). */
let patchMsg='';
/* Chybějící měsíční zápisy: u aktivního projektu musí mít každý člověk, který byl na projektu,
   za každý uplynulý měsíc zápis (i 0). Prázdné = nevyplněno. */
const memberInMonth=(m,k)=>ymOf(m.addedAt)<=k&&(!m.removedAt||ymOf(m.removedAt)>=k);
const hasLog=(p,pid,k)=>p.logs.some(l=>l.personId===pid&&l.year===ymY(k)&&l.month===ymM(k));
function missingMonths(p,uptoK){if(p.status!=='active')return[];const out=[],dm=defaultLogMonth(),end=uptoK!=null?uptoK:ym(dm.y,dm.m);
  for(let k=ymOf(p.created);k<=end;k++){const pids=p.members.filter(m=>memberInMonth(m,k)&&!hasLog(p,m.personId,k)).map(m=>m.personId);if(pids.length)out.push({k,pids});}
  return out;}
function applyPatches(){const done=state.appliedPatches||(state.appliedPatches=[]);const added=[];
  (APP.patches||[]).forEach(pt=>{if(done.includes(pt.id))return;const idMap={};
    if(pt.type==='zerofill'){const until=ymOf(pt.until+'-01');let n=0;
      state.projects.forEach(p=>missingMonths(p,until).forEach(({k,pids})=>pids.forEach(pid=>{p.logs.push({id:uid(),personId:pid,year:ymY(k),month:ymM(k),hours:0});n++;})));
      done.push(pt.id);if(n)added.push(`nuly do ${n} prázdných měsíců`);return;}
    (pt.people||[]).forEach(np=>{const ex=state.people.find(x=>(np.email&&norm(x.email)===norm(np.email))||norm(x.first+' '+x.last)===norm(np.first+' '+np.last));
      if(ex)idMap[np.id]=ex.id;else{const id='u'+uid();idMap[np.id]=id;state.people.push({...np,id,notes:np.notes||[]});}});
    (pt.projects||[]).forEach(nj=>{if(state.projects.some(x=>norm(x.name)===norm(nj.name)&&x.created===nj.created))return;const mp=o=>({...o,personId:idMap[o.personId]||o.personId});
      state.projects.push({...nj,id:'p'+uid(),members:nj.members.map(mp),logs:nj.logs.map(l=>({...mp(l),id:uid()})),payments:(nj.payments||[]).map(x=>({...mp(x),id:uid()})),daily:[],notes:nj.notes||[],progress:nj.progress||[]});});
    done.push(pt.id);added.push(pt.label||pt.id);});
  if(added.length){patchMsg='Přidáno: '+added.join(', ');save();}}
/* Denní zápisy: dokud měsíc běží, do statistik nevstupují. Po skončení měsíce se jejich součet
   propíše do měsíčního zápisu (auto), který jde v „Zapsat hodiny“ upravit. */
const dailyOf=p=>p.daily||(p.daily=[]);
function dailySum(p,pid,y,m){return dailyOf(p).reduce((a,e)=>e.personId===pid&&+e.date.slice(0,4)===y&&+e.date.slice(5,7)===m?a+e.hours:a,0);}
function rollupDaily(){let ch=false;const now=ymNow();
  state.projects.forEach(p=>{const g={};dailyOf(p).forEach(e=>{const k=ymOf(e.date);if(k>=now)return;const key=e.personId+'|'+k;g[key]=(g[key]||0)+e.hours;});
    Object.entries(g).forEach(([key,h])=>{const [pid,k]=key.split('|');const y=ymY(+k),m=ymM(+k);const l=p.logs.find(x=>x.personId===pid&&x.year===y&&x.month===m);
      if(!l){p.logs.push({id:uid(),personId:pid,year:y,month:m,hours:Math.round(h*100)/100,auto:true});ch=true;}
      else if(l.auto&&Math.abs(l.hours-h)>0.001){l.hours=Math.round(h*100)/100;ch=true;}});});
  if(ch)save();}
function save(){invalidateSched();try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}if(APP.cloud)cloudQueue();}

/* ---------- calculations ---------- */
const getP=id=>state.projects.find(p=>p.id===id);

const fullName=per=>per?`${per.first} ${per.last}`:'(smazaný kontakt)';
const initials=per=>per?((per.first||'?')[0]+(per.last||'')[0]||'').toUpperCase():'?';
const memberHPD=(p,m)=>(m&&+m.hoursPerDay)||+p.hoursPerDay||8;
const memberHours=(p,pid)=>p.logs.reduce((a,l)=>l.personId===pid?a+l.hours:a,0);
function projWork(p){let h=0,d=0;p.members.forEach(m=>{const x=memberHours(p,m.personId);h+=x;d+=x/memberHPD(p,m);});return{h,d};}
const memberPaid=(p,pid)=>p.payments.reduce((a,x)=>x.personId===pid?a+x.amount:a,0);
const memberEarned=(p,m)=>m.dayRate?memberHours(p,m.personId)/memberHPD(p,m)*m.dayRate:0;
const projCost=p=>p.members.reduce((a,m)=>a+memberEarned(p,m),0);
function projOwed(p){return p.members.reduce((a,m)=>{if(!m.dayRate)return a;return a+Math.max(0,memberEarned(p,m)-memberPaid(p,m.personId));},0);}
const activeMembers=p=>p.members.filter(m=>!m.removedAt);
function logH(p,pid,y,m){const l=p.logs.find(l=>l.personId===pid&&l.year===y&&l.month===m);return l?l.hours:0;}
function projectMonths(p){
  let s=ymOf(p.created),e=(p.status==='closed'&&p.closedAt)?ymOf(p.closedAt):Math.max(ymNow(),s);
  p.logs.forEach(l=>{const k=ym(l.year,l.month);if(k<s)s=k;if(k>e)e=k;});
  const out=[];for(let k=s;k<=e;k++)out.push({y:ymY(k),m:ymM(k),k});return out;
}
const monthsWithLogs=(p,pid)=>new Set(p.logs.filter(l=>l.hours>0&&(!pid||l.personId===pid)).map(l=>ym(l.year,l.month))).size;
function spanKeys(p){let s=ymOf(p.created),maxL=-Infinity;p.logs.forEach(l=>{const k=ym(l.year,l.month);if(k<s)s=k;if(k>maxL)maxL=k;});
  const e=(p.status==='closed'&&p.closedAt)?Math.max(ymOf(p.closedAt),maxL):Math.max(ymNow()-1,maxL,s);const out=[];for(let k=s;k<=e;k++)out.push(k);return out;}
function portfolio(scope){const list=state.projects.filter(p=>scope==='all'||(scope==='active'?p.status==='active':p.status==='closed'));
  let h=0,d=0,cost=0,owe=0,over=0;const months=new Set(),ppl=new Set();
  const pm=new Set();let wd=0;
  list.forEach(p=>{const w=projWork(p);h+=w.h;d+=w.d;cost+=projCost(p);const st=settle(p);owe+=st.owe;over+=st.over;const ks=spanKeys(p);ks.forEach(k=>months.add(k));
    const end=ks[ks.length-1];p.members.forEach(m=>{if(memberHours(p,m.personId)>0)ppl.add(m.personId);const e=Math.min(end,m.removedAt?ymOf(m.removedAt):end);for(let k=Math.max(ymOf(m.addedAt),ks[0]);k<=e;k++)pm.add(m.personId+'|'+k);});
    p.logs.forEach(l=>{wd+=l.hours/whd(p.members.find(x=>x.personId===l.personId));});});
  const mk=[...months];
  return{n:list.length,h,d,cost,owe,over,months:months.size,ppl:ppl.size,pm:pm.size,wd,minK:mk.length?Math.min(...mk):null,maxK:mk.length?Math.max(...mk):null};}
function personRating(pid){const r=[];state.projects.forEach(p=>p.members.forEach(m=>{if(m.personId===pid&&m.rating)r.push(m.rating);}));return r.length?{avg:r.reduce((a,b)=>a+b,0)/r.length,n:r.length}:null;}

const personActive=pid=>state.projects.filter(p=>p.status==='active'&&p.members.some(m=>m.personId===pid&&!m.removedAt));
function defaultLogMonth(){const d=new Date();let y=d.getFullYear(),m=d.getMonth()+1;if(d.getDate()<=10){m--;if(m===0){m=12;y--;}}return{y,m};}
/* Grafy: když má víc položek stejnou barvu (např. lidé ze stejné firmy), každá další dostane
   stejný odstín jen o kousek tmavší/světlejší, aby se v grafu daly rozlišit. */
function hexToHsl(hex){const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h/=6;}return[h,s,l];}
function hslToHex(h,s,l){const f=n=>{const k=(n+h*12)%12,a=s*Math.min(l,1-l),c=l-a*Math.max(-1,Math.min(k-3,9-k,1));return Math.round(c*255).toString(16).padStart(2,'0');};return '#'+f(0)+f(8)+f(4);}
const SHADE_STEPS=[0,-0.13,0.12,-0.23,0.21,-0.31,0.06,-0.07,0.17];
function shadeColor(hex,i){if(!i)return hex;const [h,s,l]=hexToHsl(hex),d=SHADE_STEPS[i%SHADE_STEPS.length]||0;return hslToHex(h,s,Math.max(0.2,Math.min(0.85,l+d)));}
function distinctColors(items){const seen={},map={};items.forEach(({id,base})=>{const i=seen[base]||0;seen[base]=i+1;map[id]=shadeColor(base,i);});return map;}
function seriesColors(p){return distinctColors(p.members.map(m=>{const per=getPer(m.personId);return{id:m.personId,base:tagColor(per&&per.tag)};}));}

const runDays=p=>daysBetween(p.created,(p.status==='closed'&&p.closedAt)?p.closedAt:todayISO());

const fw=(h,d)=>ui.unit==='d'?`${num1(d)} d`:`${fmtNum(h)} h`;

/* ---------- seed ---------- */

  function build(def){

function timelineChart(p,h){

  {const a=Math.min(...keys),b=Math.max(...keys);for(let k=a;k<=b;k++)keys.add(k);}

function sortProjects(list,s){
  const c=new Intl.Collator('cs');
  const f={
    'created-desc':(a,b)=>b.created.localeCompare(a.created),
    'created-asc':(a,b)=>a.created.localeCompare(b.created),
    name:(a,b)=>c.compare(a.name,b.name),
    company:(a,b)=>c.compare(a.company||'~',b.company||'~')||c.compare(a.name,b.name),
    people:(a,b)=>activeMembers(b).length-activeMembers(a).length,
    deadline:(a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'),
    hours:(a,b)=>projWork(b).h-projWork(a).h

function closeModal(){const r=$('#modal-root');r.hidden=true;r.innerHTML='';document.body.style.overflow='';const f=onCloseFn;onCloseFn=null;if(f)f();}
const footer=(primary,left)=>`<footer class="m-foot">${left||''}<span class="spacer"></span><button type="button" class="btn ghost" data-act="close-modal">Zrušit</button><button class="btn primary">${primary}</button></footer>`;
function monthSelect(name,cur){return `<select class="inp" name="${name}" id="f-${name}">${MONTHS.map((n,i)=>`<option value="${i+1}" ${i+1===cur?'selected':''}>${cap1(n)}</option>`).join('')}</select>`;}
function positionsList(){return `<datalist id="positions">${[...new Set(state.people.map(p=>p.position).filter(Boolean))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;}
function personFields(p,pre,req){p=p||{};pre=pre||'';return `
  <div class="frow"><label class="fld grow"><span>Jméno</span><input class="inp" id="${pre}first" name="${pre}first" value="${esc(p.first||'')}" ${req?'required':''} autocomplete="off"></label>
  <label class="fld grow"><span>Příjmení</span><input class="inp" id="${pre}last" name="${pre}last" value="${esc(p.last||'')}" ${req?'required':''} autocomplete="off"></label></div>
  <div class="frow"><label class="fld grow"><span>Telefon</span><input class="inp" id="${pre}phone" name="${pre}phone" type="tel" value="${esc(p.phone||'')}" autocomplete="off"></label>
  <label class="fld grow"><span>E-mail</span><input class="inp" id="${pre}email" name="${pre}email" inputmode="email" value="${esc(p.email||'')}" autocomplete="off"></label></div>
  <label class="fld"><span>Pozice</span><input class="inp" id="${pre}position" name="${pre}position" list="positions" value="${esc(p.position||'')}" placeholder="např. asistent střihu" autocomplete="off"></label>`;}

/* people picker */
function pickerHTML(){return `<div class="picker"><div class="picker-top"><input type="search" class="inp" id="pk-q" placeholder="Hledat v adresáři…" aria-label="Hledat v adresáři"><button type="button" class="btn sm" id="pk-toggle">+ Nový člověk</button></div>
  <div class="pk-new" id="pk-new" hidden>${personFields({},'n_',false)}<div class="fld"><span>Barva</span>${tagPicker('n_tag','salvej')}</div><p class="err" id="pk-err" hidden>Vyplňte jméno a příjmení.</p><div class="row-end"><button type="button" class="btn sm ghost" id="pk-cancel">Zrušit</button><button type="button" class="btn sm primary" id="pk-create">Vytvořit a přidat</button></div></div>
  <div class="pk-list" id="pk-list"></div></div>${positionsList()}`;}
function mountPicker(m,selected,exclude,onChange){
  const list=m.querySelector('#pk-list'),q=m.querySelector('#pk-q'),nf=m.querySelector('#pk-new'),c=new Intl.Collator('cs');
  const draw=()=>{const qq=norm(q.value.trim());const ppl=state.people.filter(p=>!exclude.has(p.id)&&(!qq||personMatches(p,qq))).sort((a,b)=>(selected.has(b.id)-selected.has(a.id))||c.compare(a.last,b.last));
    list.innerHTML=ppl.map(p=>`<label class="pk-row"><input type="checkbox" value="${p.id}" ${selected.has(p.id)?'checked':''}>${avatar(p)}<span><b>${esc(fullName(p))}</b><small>${esc(p.position||'')}</small></span>${(()=>{const L=personLoad(p.id);return `<span class="pk-load"><span class="lc ${loadCls(L.r)}">teď ${pct(L.r)}</span><br><span class="lc ${loadCls(L.next[1].r)}">${MONTHS_S[ymM(L.next[1].k)-1]} ${pct(L.next[1].r)}</span></span>`;})()}</label>`).join('')||'<p class="faint" style="padding:12px">Nikdo neodpovídá. Vytvořte nového člověka.</p>';};
  q.addEventListener('input',draw);
  q.addEventListener('keydown',e=>{if(e.key==='Enter')e.preventDefault();});
  list.addEventListener('change',e=>{if(e.target.type==='checkbox'){e.target.checked?selected.add(e.target.value):selected.delete(e.target.value);onChange&&onChange();}});
  m.querySelector('#pk-toggle').addEventListener('click',()=>{nf.hidden=!nf.hidden;if(!nf.hidden){const n=q.value.trim().split(/\s+/);if(n[0]&&!m.querySelector('#n_first').value){m.querySelector('#n_first').value=n[0]||'';m.querySelector('#n_last').value=n.slice(1).join(' ');}m.querySelector('#n_first').focus();}});
  m.querySelector('#pk-cancel').addEventListener('click',()=>{nf.hidden=true;});
  const create=()=>{const v=k=>m.querySelector('#n_'+k).value.trim();if(!v('first')||!v('last')){m.querySelector('#pk-err').hidden=false;return;}
    const tag=(m.querySelector('input[name=n_tag]:checked')||{}).value||'salvej';
    const per={id:'u'+uid(),first:v('first'),last:v('last'),phone:v('phone'),email:v('email'),position:v('position'),tag,notes:[]};
    state.people.push(per);save();selected.add(per.id);['first','last','phone','email','position'].forEach(k=>m.querySelector('#n_'+k).value='');m.querySelector('#pk-err').hidden=true;nf.hidden=true;q.value='';draw();onChange&&onChange();toast(`${fullName(per)} přidán(a) do adresáře`);};
  m.querySelector('#pk-create').addEventListener('click',create);
  nf.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();create();}});
  draw();
}

        state.projects.push(p);save();closeModal();go('project',p.id);toast('Projekt založen. Doplňte lidem denní sazby.');});

function openLog(pid,y,mo){
  const p=getP(pid);if(!p.members.length){toast('Nejdřív přidejte lidi na projekt');return;}
  const cur=y?{y,m:mo}:defaultLogMonth();
  const mems=p.members.slice().sort((a,b)=>(!!a.removedAt)-(!!b.removedAt));
  modal(`Zapsat hodiny`,`<form id="fl" class="form"><p class="muted" style="margin-top:-4px"><i class="dot" style="--c:${tagColor(p.tag)}"></i> ${esc(p.name)}</p>
    <div class="frow" style="align-items:flex-end"><label class="fld grow"><span>Měsíc</span>${monthSelect('m',cur.m)}</label><label class="fld w-sm"><span>Rok</span><input class="inp" type="text" inputmode="decimal" name="y" id="f-y" value="${cur.y}" min="2000" max="2100"></label><label class="fld w-sm"><span>Hotovo % <i>nep.</i></span><input class="inp" inputmode="decimal" name="pct" id="f-pct" placeholder="—" autocomplete="off"></label></div>
    <p class="hint" id="fl-prog"></p>
    <p class="hint" id="fl-hint"></p>
    <div class="logrows">${mems.map(m=>{const per=getPer(m.personId);return `<label class="logrow ${m.removedAt?'is-removed':''}">${avatar(per)}<span class="lr-name"><b>${esc(fullName(per))}</b><small class="lr-daily" data-dl="${m.personId}"></small><small>${esc(per?per.position:'')}${m.removedAt?' · odebrán':''}${memberHPD(p,m)!==8?` · 1 d = ${memberHPD(p,m)} h`:''}</small></span><span class="lr-in"><input class="inp" inputmode="decimal" name="h_${m.personId}" id="h_${m.personId}" placeholder="—" autocomplete="off"><em>h</em></span><span class="lr-d mono" data-d="${m.personId}"></span></label>`;}).join('')}</div>
    <div class="logtotal"><span>Celkem za měsíc</span><b class="mono" id="fl-tot">0 h</b></div>
    ${footer('Uložit',`<button type="button" class="btn danger" id="fl-del" hidden>Smazat celý měsíc</button>`)}</form>`,{noFocus:true,onMount(md){
      const f=md.querySelector('#fl'),E=f.elements;
      const dailyNote=m=>{const el=md.querySelector(`[data-dl="${m.personId}"]`),ds=dailySum(p,m.personId,+E.y.value,+E.m.value);if(!ds){el.innerHTML='';el.classList.remove('diff');return;}
        const raw=String(E['h_'+m.personId].value).trim(),diff=raw===''||Math.abs(parseNum(raw)-ds)>0.01;el.classList.toggle('diff',diff);
        el.innerHTML=diff?`denní zápisy: ${fmtNum(ds)} h · měsíční zápis se liší <button type="button" class="sync-d" data-sync="${m.personId}">Srovnat dle denních</button>`:`denní zápisy: ${fmtNum(ds)} h · sedí`;};
      md.querySelector('.logrows').addEventListener('click',e=>{const b=e.target.closest('[data-sync]');if(!b)return;e.preventDefault();e.stopPropagation();const m=mems.find(x=>x.personId===b.dataset.sync);
        E['h_'+m.personId].value=String(Math.round(dailySum(p,m.personId,+E.y.value,+E.m.value)*100)/100).replace('.',',');recalc();});
      const recalc=()=>{let t=0;mems.forEach(m=>{dailyNote(m);const v=parseNum(E['h_'+m.personId].value);t+=v;md.querySelector(`[data-d="${m.personId}"]`).textContent=v?num1(v/memberHPD(p,m))+' d':'';});md.querySelector('#fl-tot').textContent=fmtNum(t)+' h';};
      const fill=()=>{const yy=+E.y.value,mm=+E.m.value;let any=false;mems.forEach(m=>{const l=p.logs.find(l=>l.personId===m.personId&&l.year===yy&&l.month===mm),ds=dailySum(p,m.personId,yy,mm);
          E['h_'+m.personId].value=l?String(l.hours).replace('.',','):(ds?String(Math.round(ds*100)/100).replace('.',','):'');if(l||ds)any=true;
          });
        const pe=progressEntry(p,yy,mm);E.pct.value=pe?pe.pct:'';const pi=progressInfo(p);md.querySelector('#fl-prog').textContent=pi.cur!=null?`Hotovo teď podle výpočtu: ${pct(Math.min(1,pi.cur))}. Pokud % nevyplníte, vychází se z posledního zadaného a dopočítá se.`:'Hotovo % je nepovinné. Bez něj se průběh počítá z odhadu MD nebo rozpočtu.';
        md.querySelector('#fl-hint').textContent=any?`${cap1(MONTHS[mm-1])} ${yy} už má zápis. Úpravou ho přepíšete, prázdné pole záznam smaže.`:`Nový zápis za ${MONTHS[mm-1]} ${yy}.`;md.querySelector('#fl-del').hidden=!any;recalc();};
      E.m.addEventListener('change',fill);E.y.addEventListener('change',fill);f.addEventListener('input',e=>{if((e.target.name||'').startsWith('h_'))recalc();});
      const del=md.querySelector('#fl-del');
      del.addEventListener('click',()=>{if(!armed(del,'Opravdu smazat měsíc?'))return;const yy=+E.y.value,mm=+E.m.value;p.logs=p.logs.filter(l=>!(l.year===yy&&l.month===mm));p.daily=dailyOf(p).filter(e=>!(+e.date.slice(0,4)===yy&&+e.date.slice(5,7)===mm));p.progress=(p.progress||[]).filter(e=>!(e.year===yy&&e.month===mm));closeModal();commit(`Smazáno: ${MONTHS[mm-1]} ${yy}`);});
      f.addEventListener('submit',e=>{e.preventDefault();const yy=+E.y.value,mm=+E.m.value;if(!yy){return;}
        mems.forEach(m=>{const raw=String(E['h_'+m.personId].value).trim(),v=parseNum(raw);const i=p.logs.findIndex(l=>l.personId===m.personId&&l.year===yy&&l.month===mm);
          const hasDaily=dailySum(p,m.personId,yy,mm)>0;
          if(raw!==''||hasDaily){if(i>=0){p.logs[i].hours=v;delete p.logs[i].auto;}else p.logs.push({id:uid(),personId:m.personId,year:yy,month:mm,hours:v});}else if(i>=0)p.logs.splice(i,1);});
        p.progress=(p.progress||[]).filter(e=>!(e.year===yy&&e.month===mm));const pv=String(E.pct.value).trim();if(pv!==''){p.progress.push({year:yy,month:mm,pct:Math.max(0,Math.min(100,Math.round(parseNum(pv))))});}
        closeModal();commit(`Zapsáno: ${MONTHS[mm-1]} ${yy}`);});
      fill();const first=md.querySelector('.lr-in input');if(first)setTimeout(()=>first.focus(),30);
  }});
}
function openDay(pid,perId,date){

    const f=md.querySelector('#fd'),E=f.elements,list=md.querySelector('#fd-list');

      const sum=ent.reduce((a,e)=>a+e.hours,0),done=ym(y,m)<ymNow(),l=p.logs.find(x=>x.personId===pid2&&x.year===y&&x.month===m);
      list.innerHTML=`<div class="dlist-h"><b>${cap1(MONTHS[m-1])} ${y}</b><span>${fmtNum(sum)} h · ${num1(sum/whd(p.members.find(x=>x.personId===pid2)))} d</span></div>
        <p class="hint">${done?(l?`Měsíc skončil. V měsíčním zápisu je ${fmtNum(l.hours)} h${l.auto?' (převzato z denních)':''}.`:'Měsíc skončil.'):'Měsíc probíhá, zatím se nezapočítává do statistik.'}</p>

function dayStrip(p){

  const head=Array.from({length:dim},(_,i)=>{const wd=new Date(Date.UTC(y,m-1,i+1)).getUTCDay();return `<th class="${wd===0||wd===6?'we':''}">${i+1}</th>`;}).join('');
  return `<section class="card"><div class="card-h"><h2>Den po dni</h2><div class="mnav"><button class="gear" data-act="day-nav" data-d="-1" aria-label="Předchozí měsíc">‹</button><b>${cap1(MONTHS[m-1])} ${y}</b><button class="gear" data-act="day-nav" data-d="1" aria-label="Další měsíc">›</button></div></div>
  <div class="tscroll"><table class="days"><thead><tr><th class="who-h"></th>${head}<th class="sum-h">Σ</th></tr></thead><tbody>
  ${ppl.map(mm=>{let sum=0;const cells=Array.from({length:dim},(_,i)=>{const d=`${y}-${pad(m)}-${pad(i+1)}`,e=dailyOf(p).find(x=>x.personId===mm.personId&&x.date===d),wd=new Date(Date.UTC(y,m-1,i+1)).getUTCDay();if(e)sum+=e.hours;
      return `<td class="${wd===0||wd===6?'we':''}${d===todayISO()?' td-today':''}"><button class="dcell${e?' on':''}" style="--c:${cols[mm.personId]}" data-act="open-day" data-pid="${p.id}" data-per="${mm.personId}" data-date="${d}" title="${fmtDate(d)}${e?`: ${fmtNum(e.hours)} h${e.note?' · '+esc(e.note):''}`:' · zapsat'}">${e?fmtNum(e.hours):''}</button></td>`;}).join('');
    return `<tr><th class="who-h">${esc(getPer(mm.personId)?getPer(mm.personId).first:'?')}</th>${cells}<td class="sum-h"><b>${fmtNum(sum)}</b></td></tr>`;}).join('')}

function personDays(pid){
  const any=state.projects.some(p=>dailyOf(p).some(e=>e.personId===pid));if(!any)return '';
  const k=ui.dayK!=null?ui.dayK:ymNow(),y=ymY(k),m=ymM(k),dim=new Date(Date.UTC(y,m,0)).getUTCDate(),first=(new Date(Date.UTC(y,m-1,1)).getUTCDay()+6)%7;
  const dcm=projColors(new Set(state.projects.filter(p=>dailyOf(p).some(e=>e.personId===pid)).map(p=>p.id)));let cells='';for(let i=0;i<first;i++)cells+='<div class="cal-e"></div>';let tot=0;
  for(let d=1;d<=dim;d++){const iso=`${y}-${pad(m)}-${pad(d)}`;const ent=[];state.projects.forEach(p=>dailyOf(p).forEach(e=>{if(e.personId===pid&&e.date===iso)ent.push({p,e});}));const h=ent.reduce((a,x)=>a+x.e.hours,0);tot+=h;const wd=(first+d-1)%7;

  <div class="cal">${['po','út','st','čt','pá','so','ne'].map(x=>`<div class="cal-w">${x}</div>`).join('')}${cells}</div><p class="hint">Denní zápisy ze všech projektů. Barevná tečka = projekt.</p></section>`;

  'close-project':t=>openClose1(t.dataset.id),
  reopen:t=>{if(!armed(t,'Opravdu znovu otevřít?'))return;const p=getP(t.dataset.id);p.status='active';p.closedAt=null;save();hist=[];ui.view='project';ui.id=p.id;render();toast('Projekt je znovu aktivní');},
  'del-note':t=>{if(!armed(t,'Opravdu smazat?'))return;const o=t.dataset.kind==='person'?getPer(t.dataset.id):getP(t.dataset.id);o.notes=(o.notes||[]).filter(n=>n.id!==t.dataset.nid);commit('Poznámka smazána');},
  'set-tag':t=>{const o=t.dataset.kind==='person'?getPer(t.dataset.id):getP(t.dataset.id);o.tag=t.dataset.tag;commit();},
  copy:t=>{const v=t.dataset.text;try{navigator.clipboard.writeText(v).then(()=>{t.textContent='zkopírováno';},()=>{t.textContent='nepodařilo se';});}catch(e){t.textContent='nepodařilo se';}},
  'open-day':t=>openDay(t.dataset.pid,t.dataset.per,t.dataset.date),
  'work-day':t=>openWorkDay(t.dataset.date),
  'work-nav':t=>{const d=+t.dataset.d;ui.workK=d===0?ymNow():(ui.workK!=null?ui.workK:ymNow())+d;render();},
  'work-month':t=>{ui.workK=+t.dataset.k;render();window.scrollTo(0,0);},
  'work-year':t=>{ui.workY=(ui.workY||ymY(ui.workK!=null?ui.workK:ymNow()))+(+t.dataset.d);render();},
  'work-import':()=>openWorkImport(),
  'work-now':t=>workNow(t.dataset.w),
  'day-nav':t=>{ui.dayK=(ui.dayK!=null?ui.dayK:ymNow())+(+t.dataset.d);render();},
  'apply-deadline':t=>{const p=getP(t.dataset.id);const old=p.deadline;p.deadline=t.dataset.d;p.notes.push({id:uid(),date:todayISO(),ts:Date.now(),text:`Deadline posunut z ${fmtDate(old)} na ${fmtDate(p.deadline)} (podle předpovědi).`});commit('Deadline posunut');},
  scope:t=>{ui.scope=t.dataset.s;savePrefs();render();},
  msort:t=>{const k=t.dataset.k,st=t.dataset.s||'msort',S=ui[st];ui[st]=S.k===k?{k,dir:-S.dir}:{k,dir:k==='name'?1:-1};savePrefs();render();},
  data:()=>openData(),
  'close-modal':()=>closeModal(),
  scrim:(t,e)=>{if(e.target===t)closeModal();}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=ACTS[t.dataset.act];if(f){if(t.tagName==='BUTTON'&&t.closest('form')&&t.type!=='submit')e.preventDefault();f(t,e);}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('#modal-root').hidden){closeModal();return;}
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&$('#modal-root').hidden){e.preventDefault();$('#q').focus();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('article[data-act]')){e.preventDefault();e.target.click();}
});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.change;if(k==='sort'){ui.sort=e.target.value;savePrefs();render();}if(k==='dsort'){ui.dsort=e.target.value;savePrefs();render();}if(k==='work-cmp'){ui.workCmp=e.target.checked;render();}if(k==='psort'&&e.target.value){const [kk,dd]=e.target.value.split(':');ui[e.target.dataset.s||'msort']={k:kk,dir:+dd};savePrefs();render();}});
document.addEventListener('submit',e=>{const f=e.target;if(!f.classList.contains('note-add'))return;e.preventDefault();const t=f.elements.t.value.trim();if(!t)return;
  const o=f.dataset.kind==='person'?getPer(f.dataset.id):getP(f.dataset.id);o.notes=o.notes||[];o.notes.push({id:uid(),date:todayISO(),ts:Date.now(),text:t});commit('Poznámka přidána');});
$('#q').addEventListener('input',e=>{ui.q=e.target.value;if(['project','person','summary'].includes(ui.view)){ui.view='projects';ui.id=null;hist=[];}render();});

/* ---------- cloud (Supabase) ---------- */
let sb=null,cloudUser=null,cloudVer=0,cloudTimer=null,cloudBusy=false,cloudDirty=false;
function syncState(t,cls){const el=$('#sync');if(!el)return;el.hidden=false;el.textContent=t;el.className='sync '+(cls||'');}
function cloudQueue(){if(!sb||!cloudUser)return;cloudDirty=true;syncState('Ukládám…');clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudFlush,700);}
async function cloudFetch(){const {data,error}=await sb.from('app_state').select('data,version').maybeSingle();if(error)return false;return data;}
async function cloudFlush(){
  if(cloudBusy){clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudFlush,400);return;}
  if(!cloudDirty)return;cloudBusy=true;cloudDirty=false;
  const {data,error}=await sb.rpc('save_state',{p_data:state,p_version:cloudVer});cloudBusy=false;
  if(error){
    if(/version conflict/i.test(error.message||'')){
      try{localStorage.setItem(KEY+'.conflict.'+Date.now(),JSON.stringify(state));}catch(e){}
      const r=await cloudFetch();if(r){state=r.data;cloudVer=r.version;rollupDaily();render();}
      syncState('Uloženo','ok');toast('Data se mezitím změnila na jiném zařízení. Načetl jsem aktuální verzi, poslední úpravu prosím zopakujte.');
    }else{cloudDirty=true;syncState('Neuloženo, zkouším znovu','bad');clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudFlush,5000);}
    return;}
  cloudVer=data;if(!cloudDirty)syncState('Uloženo','ok');}
const appURL=()=>location.origin+location.pathname;
function authView(mode,msg){
  const el=$('#auth');el.hidden=false;document.body.style.overflow='hidden';
  const head=`<div class="auth-brand"><b>Střižna</b><small>${esc(APP.tagline||'')}</small></div>`;
  const note=msg?`<p class="auth-msg ${mode==='error'||mode==='denied'?'bad':''}">${msg}</p>`:'';
  let body='';
  if(mode==='loading')body=`<p class="muted">Načítám data…</p>`;
  else if(mode==='denied')body=`<p class="auth-msg bad">Tento účet nemá k datům přístup.</p><button class="btn" id="a-out">Odhlásit</button>`;
  else if(mode==='error')body=`${note}<button class="btn" id="a-retry">Zkusit znovu</button>`;
  else if(mode==='newpass')body=`<form id="a-f" class="form"><p class="muted">Zadejte nové heslo.</p><label class="fld"><span>Nové heslo</span><input class="inp" type="password" id="a-pass" autocomplete="new-password" required></label>${note}<button class="btn primary">Uložit heslo</button></form>`;
  else{const sign=mode==='signup',forgot=mode==='forgot';
    body=`<form id="a-f" class="form"><label class="fld"><span>E-mail</span><input class="inp" type="email" id="a-email" autocomplete="email" required></label>
      ${forgot?'':`<label class="fld"><span>Heslo${sign?' <i>aspoň 8 znaků</i>':''}</span><input class="inp" type="password" id="a-pass" autocomplete="${sign?'new-password':'current-password'}" required></label>`}
      ${note}<button class="btn primary">${sign?'Vytvořit účet':forgot?'Poslat odkaz na nové heslo':'Přihlásit'}</button>
      <div class="auth-links">${mode!=='login'?'<button type="button" data-m="login">Zpět na přihlášení</button>':'<button type="button" data-m="forgot">Zapomenuté heslo</button><button type="button" data-m="signup">První přihlášení: vytvořit účet</button>'}</div></form>`;}
  el.innerHTML=`<div class="auth-card">${head}${body}</div>`;
  el.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>authView(b.dataset.m)));
  const out=el.querySelector('#a-out');if(out)out.addEventListener('click',cloudLogout);
  const re=el.querySelector('#a-retry');if(re)re.addEventListener('click',()=>location.reload());
  const f=el.querySelector('#a-f');if(!f)return;
  const em=f.querySelector('#a-email');if(em){try{em.value=localStorage.getItem(KEY+'.email')||'';}catch(e){}}
  setTimeout(()=>{const i=f.querySelector(em&&em.value?'#a-pass':'input');if(i)i.focus();},30);
  f.addEventListener('submit',async e=>{e.preventDefault();const btn=f.querySelector('.btn.primary');btn.disabled=true;
    const email=em?em.value.trim():'',pass=(f.querySelector('#a-pass')||{}).value||'';
    try{if(em)localStorage.setItem(KEY+'.email',email);}catch(x){}
    let r;
    if(mode==='newpass'){r=await sb.auth.updateUser({password:pass});if(!r.error){authView('loading');const {data:{session}}=await sb.auth.getSession();if(session)return cloudEnter(session.user);}}
    else if(mode==='signup'){if(pass.length<8){btn.disabled=false;return authView('signup','Heslo musí mít aspoň 8 znaků.');}
      r=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:appURL()}});
      if(!r.error){if(r.data.session)return cloudEnter(r.data.user);return authView('login','Účet je vytvořený. Na e-mail přišel odkaz pro potvrzení. Po kliknutí na něj se tady přihlaste.');}}
    else if(mode==='forgot'){r=await sb.auth.resetPasswordForEmail(email,{redirectTo:appURL()});if(!r.error)return authView('login','Pokud účet existuje, přišel na e-mail odkaz pro nastavení nového hesla.');}
    else{r=await sb.auth.signInWithPassword({email,password:pass});if(!r.error)return cloudEnter(r.data.user);}
    btn.disabled=false;const m=(r.error&&r.error.message)||'';
    authView(mode,/invalid login/i.test(m)?'Nesprávný e-mail nebo heslo.':/not confirmed/i.test(m)?'E-mail ještě není potvrzený. Klikněte na odkaz v e-mailu.':/rate limit/i.test(m)?'Příliš mnoho pokusů, zkuste to za chvíli.':/already registered/i.test(m)?'Účet už existuje, přihlaste se.':'Nepodařilo se: '+esc(m));});
}
function authHide(){const el=$('#auth');el.hidden=true;el.innerHTML='';document.body.style.overflow='';}
async function cloudLogout(){if(cloudDirty){await cloudFlush();}await sb.auth.signOut();cloudUser=null;state={settings:{hoursPerDay:8},people:[],projects:[]};$('#view').innerHTML='';$('#sync').hidden=true;authView('login');}
async function cloudEnter(user){
  cloudUser=user;authView('loading');
  const ok=await sb.rpc('strizna_allowed');if(ok.error)return authView('error','Nepodařilo se ověřit přístup: '+esc(ok.error.message));
  if(!ok.data)return authView('denied');
  const r=await cloudFetch();if(r===false)return authView('error','Data se nepodařilo načíst. Zkontrolujte připojení.');
  if(r){state=r.data;cloudVer=r.version;}else{state=initialData();cloudVer=0;}
  if(!valid(state))state=initialData();
  authHide();applyPatches();rollupDaily();render();syncState('Uloženo','ok');if(patchMsg){toast(patchMsg);patchMsg='';}
  if(!r)setTimeout(()=>{toast('Databáze je zatím prázdná. Nahrajte zálohu: Data → Obnovit ze zálohy.');openData();},400);
}
async function cloudBoot(){
  if(!window.supabase||!window.supabase.createClient)return authView('error','Nepodařilo se načíst přihlašování. Zkontrolujte připojení a obnovte stránku.');
  sb=window.supabase.createClient(APP.cloud.url,APP.cloud.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  let recovering=/type=recovery/.test(location.hash);
  sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){recovering=true;authView('newpass');}});
  const {data:{session}}=await sb.auth.getSession();
  if(recovering)return authView('newpass');
  if(session)cloudEnter(session.user);else authView('login');
  document.addEventListener('visibilitychange',async()=>{if(document.visibilityState!=='visible'||!cloudUser||cloudDirty||cloudBusy)return;
    const r=await cloudFetch();if(r&&r.version>cloudVer&&!cloudDirty){state=r.data;cloudVer=r.version;rollupDaily();render();toast('Načtena novější data z jiného zařízení');}});
  window.addEventListener('beforeunload',e=>{if(cloudDirty||cloudBusy){e.preventDefault();e.returnValue='';}});
}
if(APP.cloud)cloudBoot();else{load();render();if(patchMsg)toast(patchMsg);}
})();
</script>
